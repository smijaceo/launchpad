[project]
name = "launchpad"
version = "0.1.0"
description = "Turn gapfinder launch briefs into validation-first launches: positioning, brand, copy, site, outreach."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "Markdown>=3.5",      # site copy → HTML (launchpad/site.py)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["launchpad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
